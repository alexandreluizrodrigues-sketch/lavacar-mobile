<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#093a80"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="LavaCar"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="style.css"><title>LavaCar Mobile</title></head><body><header><div class="brand"><img class="header-logo" src="icons/alr-logo.png" alt="ALR TECH"><div><strong>LavaCar <span>Mobile</span></strong><small>v2.0 · Etapa 2 · Offline</small></div></div><span id="connection" class="status">Local</span></header><main><section id="view"></section></main><nav id="tabs" aria-label="Navegação principal"><button data-page="inicio" class="active">⌂<small>Início</small></button><button data-page="agenda">▦<small>Agenda</small></button><button data-page="clientes">♙<small>Clientes</small></button><button data-page="financeiro">＄<small>Caixa</small></button><button data-page="estoque">▤<small>Estoque</small></button><button data-page="mais">☷<small>Mais</small></button></nav><dialog id="editor"><form id="editForm"><div class="modal-head"><h2 id="modalTitle">Cadastro</h2><button type="button" id="closeDialog" class="icon-btn" aria-label="Fechar">✕</button></div><div id="fields"></div><footer><button type="button" id="cancelDialog" class="light">Cancelar</button><button type="submit" id="saveBtn">Salvar</button></footer></form></dialog><dialog id="waDialog"><div class="wa-modal"><div class="modal-head"><h2>Mensagem WhatsApp</h2><button id="closeWa" class="icon-btn" aria-label="Fechar">✕</button></div><div class="field"><label>Tipo de mensagem</label><select id="waType"><option value="confirmacao">Confirmação</option><option value="lembrete">Lembre
